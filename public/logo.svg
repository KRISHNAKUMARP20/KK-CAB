  <path d="M32 46 C32 46, 42 33, 50 33 C58 33, 68 46, 68 46 L78 46 C82 46, 85 49, 85 53 L81 61 C80 63, 77 65, 74 65 L26 65 C23 65, 20 63, 19 61 L15 53 C15 49, 18 46, 22 46 Z" fill="url(#body-grad)" stroke="#22d3ee" stroke-width="3"/>
